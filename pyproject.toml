[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio-medical-bot"
version = "0.4.0"
description = "Local cardiovascular Agentic RAG with attachments and controlled MCP tools"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn[standard]>=0.22,<0.35",
  "pydantic>=2.5,<3",
  "python-multipart>=0.0.6,<1",
  "httpx>=0.24,<0.28",
  "openai>=1.40,<2",
  "langgraph>=0.2,<1",
  "python-dotenv==1.1.0",
  "jieba==0.42.1",
  "pytest>=7,<9",
  "pytest-asyncio>=0.21,<0.25",
]

[project.optional-dependencies]
agentic = ["mcp==2.2.0", "rapidocr==3.9.2", "onnxruntime>=1.20,<2", "pypdf==6.19.0", "pypdfium2==5.13.0", "Pillow>=11,<13", "beautifulsoup4>=4.12,<5"]
semantic = [
  "sentence-transformers==3.4.1",
  "transformers==4.48.3",
  "huggingface-hub==0.28.1",
  "tokenizers==0.21.4",
  "safetensors==0.5.3",
  "sentencepiece==0.2.1",
]
browser-test = ["playwright==1.51.0"]
data = [
  "datasets>=2.14,<3",
]
pdf = [
  "pypdf>=4,<7",
]
translation = [
  "argostranslate>=1.9,<2",
]
infra = [
  "redis>=5,<6",
  "chromadb>=0.4,<0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
